<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d9eaf4">
    <link rel="icon" href="data:,">
    <title>蜥蜴互动与简历</title>
    <script type="module" crossorigin src="./assets/index-C5fhEnmA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-FbwjTd-1.css">
  </head>
  <body data-loading data-view="home">
    <header class="site-header">
      <nav class="site-tabs" role="tablist" aria-label="页面">
        <button
          id="home-tab"
          class="site-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="home-panel"
          data-view-target="home"
        >首页</button>
        <button
          id="resume-tab"
          class="site-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="resume-panel"
          tabindex="-1"
          data-view-target="resume"
        >简历</button>
      </nav>
    </header>

    <main class="app-shell">
      <section
        id="home-panel"
        class="view-panel home-panel stage"
        role="tabpanel"
        aria-labelledby="home-tab"
        data-active
      >
        <video
          class="gecko"
          muted
          playsinline
          preload="auto"
          aria-label="蜥蜴头部跟随鼠标方向"
        ></video>

        <div class="loading-overlay" role="status" aria-live="polite" aria-label="正在加载首页">
          <span class="loading-spinner" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
        </div>
      </section>

      <section
        id="resume-panel"
        class="view-panel resume-panel"
        role="tabpanel"
        aria-labelledby="resume-tab"
        aria-hidden="true"
        inert
      >
        <div class="resume-shell">
          <div class="pdf-toolbar" role="toolbar" aria-label="简历工具栏">
            <div class="toolbar-group">
              <button class="icon-button" type="button" data-action="zoom-out" aria-label="缩小" data-tooltip="缩小">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
              </button>
              <output class="toolbar-value" data-zoom aria-live="polite">100%</output>
              <button class="icon-button" type="button" data-action="zoom-in" aria-label="放大" data-tooltip="放大">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <button class="icon-button" type="button" data-action="fit-width" aria-label="适合宽度" data-tooltip="适合宽度">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7v10M20 7v10M8 12h8M8 12l3-3M8 12l3 3M16 12l-3-3M16 12l-3 3"/></svg>
              </button>
            </div>

            <output class="page-count" aria-label="页码">
              <span data-page-current>1</span><span aria-hidden="true"> / </span><span data-page-total>1</span>
            </output>

            <div class="toolbar-group">
              <a class="icon-button" href="./resume-demo.pdf" target="_blank" rel="noopener" aria-label="新窗口查看" data-tooltip="新窗口查看">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
              </a>
              <a class="icon-button" href="./resume-demo.pdf" download aria-label="下载简历" data-tooltip="下载简历">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>
              </a>
            </div>
          </div>

          <div class="pdf-viewport" tabindex="0" aria-label="简历内容">
            <div class="pdf-status" data-pdf-status role="status" aria-live="polite">
              <span class="loading-spinner" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
              <span class="visually-hidden">正在加载简历</span>
            </div>
            <div class="pdf-error" data-pdf-error role="alert" hidden>简历加载失败</div>
            <div class="pdf-pages" data-pdf-pages></div>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
